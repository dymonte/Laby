image: gcc

stages:
  - build
  - test
  - doc
  - clean

variables:
  MAKE: make

build:
  stage: build
  script:
    - ${MAKE} maze
  artifacts:
    paths:
      - obj
      - ./maze
    when: on_success

doc:
  stage: doc
  script:
    - ${MAKE} doc
  artifacts:
    paths:
      - doc
      - ./refman.pdf

test:
  stage: test
  script:
    - ${MAKE} run

clean:
  stage: clean
  script:
    - ${MAKE} clean