image: gcc

stages:
  - build
  - test
  - clean

variables:
  MAKE: make

build:
  stage: build
  script:
    - ${MAKE} maze
  artifacts:
    paths:
      - obj
      - ./maze
    when: on_success

test:
  stage: test
  script:
    - ${MAKE} test

clean:
  stage: clean
  script:
    - ${MAKE} clean